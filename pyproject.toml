[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mgbsed"
version = "1.0.0"
description = "MGB-SED v1.0 em Python: traducao verificada do modelo hidrossedimentologico MGB-IPH/MGB-SED (Fortran)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Ivan Mangini"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
keywords = ["hidrologia", "sedimentos", "MGB-IPH", "MGB-SED", "MUSLE", "Muskingum-Cunge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib>=3.7"]

[project.scripts]
mgbsed = "mgbsed.main:cli"

[tool.setuptools]
packages = ["mgbsed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::RuntimeWarning"]
